<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Michael Heavener on GitHub — projects, repositories, and recent activity.">
  <title>GitHub // Michael Heavener</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="github-page" data-github-root>
  <div class="github-wrap">
    <header class="github-header">
      <div>
        <p class="github-eyebrow">HEAVENER.CO / GITHUB</p>
        <h1>Code,<br><em>in motion.</em></h1>
      </div>
      <a class="back-link" href="https://heavener.co">← HEAVENER.CO</a>
    </header>

    <section class="github-section">
      <div class="section-head">
        <h2>Profile</h2>
        <span class="meta" data-updated>LOADING…</span>
      </div>
      <div class="profile" data-profile>
        <div class="status-line"><span class="dot"></span>Loading GitHub…</div>
      </div>
    </section>

    <section class="github-section">
      <div class="section-head">
        <h2>Repositories</h2>
        <span class="meta">LIVE FROM GITHUB</span>
      </div>
      <div class="repo-grid" data-repos>
        <div class="repo"><div class="status-line"><span class="dot"></span>Loading repositories…</div></div>
      </div>
    </section>

    <section class="github-section">
      <div class="section-head">
        <h2>Recent activity</h2>
        <span class="meta">PUBLIC EVENTS</span>
      </div>
      <div class="activity" data-activity>
        <div class="activity-item"><div class="status-line"><span class="dot"></span>Loading activity…</div></div>
      </div>
    </section>
  </div>

  <footer class="github-footer">
    <span>© 2026 HEAVENER</span>
    <a href="https://github.com/michaelheavener4" target="_blank" rel="noopener noreferrer">GITHUB ↗</a>
  </footer>
  <script src="/script.js"></script>
</body>
</html>
